<title>Consultorio SAAMA</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="./app/saama.css">
<link rel="stylesheet" href="./app/panel.css">

<!-- ---------------- Acceso ---------------- -->

<div id="puerta">
  <form id="login">
    <div class="marca">
      <h1 class="mark">SAAMA</h1>
      <p class="kicker">Consultorio</p>
    </div>
    <div class="field">
      <label for="email">Correo</label>
      <input type="email" id="email" autocomplete="username" required>
    </div>
    <div class="field">
      <label for="clave">Contraseña</label>
      <input type="password" id="clave" autocomplete="current-password" required>
    </div>
    <p class="err" id="err-login"></p>
    <button type="submit" class="primary" id="entrar">Entrar</button>
  </form>
</div>

<!-- ---------------- Panel ---------------- -->

<div id="panel">
  <div class="barra">
    <span class="mark">SAAMA</span>
    <nav class="navegacion" id="navegacion" aria-label="Secciones"></nav>
    <div class="barra-fin">
      <span class="quien" id="quien"></span>
      <button type="button" class="mini" id="salir">Salir</button>
    </div>
  </div>

  <div class="vista" id="vista-tablero"><div class="desplazable" id="lienzo-tablero"></div></div>
  <div class="vista partida" id="vista-fichas"></div>
  <div class="vista" id="vista-agenda"><div class="desplazable" id="lienzo-agenda"></div></div>
  <div class="vista" id="vista-reportes"><div class="desplazable" id="lienzo-reportes"></div></div>
</div>

<script type="module">
  import { dbPanel as db, configurado } from "./app/db.js";
  import { crear } from "./app/formato.js";
  import { cargarTodo, alCambiar } from "./app/datos.js";
  import { montarTablero, refrescarTablero } from "./app/vistas/tablero.js";
  import { montarFichas, refrescarFichas, abrirFicha } from "./app/vistas/fichas.js";
  import { montarAgenda, refrescarAgenda } from "./app/vistas/agenda.js";
  import { montarReportes, refrescarReportes } from "./app/vistas/reportes.js";

  const puerta = document.getElementById("puerta");
  const panel = document.getElementById("panel");
  const errLogin = document.getElementById("err-login");

  const VISTAS = [
    { clave: "tablero", label: "Consultorio" },
    { clave: "fichas", label: "Fichas" },
    { clave: "agenda", label: "Agenda" },
    { clave: "reportes", label: "Reportes" }
  ];

  let vistaActual = "tablero";
  let montado = false;

  // ---------- Navegación ----------

  const navegacion = document.getElementById("navegacion");
  VISTAS.forEach(v => {
    const b = crear("button", null, v.label);
    b.type = "button";
    b.dataset.vista = v.clave;
    b.addEventListener("click", () => irA(v.clave));
    navegacion.append(b);
  });

  function irA(clave) {
    vistaActual = clave;
    VISTAS.forEach(v => {
      document.getElementById("vista-" + v.clave).classList.toggle("activa", v.clave === clave);
      navegacion.querySelector(`[data-vista="${v.clave}"]`)
        .setAttribute("aria-current", v.clave === clave ? "true" : "false");
    });
    // Cada vista se redibuja al entrar: así nunca muestra datos viejos
    if (clave === "tablero") refrescarTablero();
    if (clave === "fichas") refrescarFichas();
    if (clave === "agenda") refrescarAgenda();
    if (clave === "reportes") refrescarReportes();
    location.hash = clave;
  }

  // ---------- Sesión ----------

  const mostrarLogin = () => { puerta.classList.add("show"); panel.classList.remove("show"); };

  async function mostrarPanel(sesion) {
    puerta.classList.remove("show");
    panel.classList.add("show");
    document.getElementById("quien").textContent = sesion.user.email;

    const { error } = await cargarTodo();
    if (error) {
      document.getElementById("lienzo-tablero").replaceChildren(
        crear("div", "vacio", "No se pudieron cargar los datos: " + error.message));
      irA("tablero");
      return;
    }

    if (!montado) {
      montarTablero(document.getElementById("lienzo-tablero"), {
        alElegirFicha: id => { irA("fichas"); abrirFicha(id); }
      });
      montarFichas(document.getElementById("vista-fichas"));
      montarAgenda(document.getElementById("lienzo-agenda"));
      montarReportes(document.getElementById("lienzo-reportes"));

      // Un cambio en los datos repinta la vista que se está mirando
      alCambiar(() => {
        if (vistaActual === "tablero") refrescarTablero();
        if (vistaActual === "fichas") refrescarFichas();
        if (vistaActual === "agenda") refrescarAgenda();
        if (vistaActual === "reportes") refrescarReportes();
      });
      montado = true;
    }

    const desdeUrl = location.hash.replace("#", "");
    irA(VISTAS.some(v => v.clave === desdeUrl) ? desdeUrl : "tablero");
  }

  // Primero se pinta el login, siempre y sin esperar a nadie. Si hay sesión
  // guardada, onAuthStateChange la trae enseguida y cambia al panel.
  mostrarLogin();

  if (!configurado) {
    errLogin.textContent = "Falta completar app/config.js con los datos del proyecto Supabase.";
    errLogin.classList.add("show");
  } else {
    db.auth.onAuthStateChange((_evento, sesion) => {
      sesion ? mostrarPanel(sesion) : mostrarLogin();
    });
  }

  document.getElementById("login").addEventListener("submit", async e => {
    e.preventDefault();
    const boton = document.getElementById("entrar");
    errLogin.classList.remove("show");
    boton.disabled = true;
    boton.textContent = "Entrando…";

    const { error } = await db.auth.signInWithPassword({
      email: document.getElementById("email").value.trim(),
      password: document.getElementById("clave").value
    });

    boton.disabled = false;
    boton.textContent = "Entrar";

    if (error) {
      errLogin.textContent = error.message === "Invalid login credentials"
        ? "Correo o contraseña incorrectos."
        : error.message;
      errLogin.classList.add("show");
      return;
    }
    document.getElementById("clave").value = "";
  });

  document.getElementById("salir").addEventListener("click", async () => {
    await db.auth.signOut();   // onAuthStateChange devuelve la pantalla de login
  });
</script>
